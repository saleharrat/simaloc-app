<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simaloc - Professional Audio & Video Subtitle & Dubbing Prep Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --accent: #10B981;
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --bg-input: #0F172A;
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
            --font-family: 'Inter', 'Tajawal', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        header {
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 0;
        }

        .nav-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .lang-switch-btn {
            background-color: var(--bg-input);
            color: var(--text-light);
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .lang-switch-btn:hover {
            background-color: var(--primary);
        }

        .hero {
            padding: 80px 20px 40px;
            text-align: center;
            max-width: 950px;
            margin: 0 auto;
        }

        .badge {
            background-color: rgba(79, 70, 229, 0.2);
            color: #818CF8;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(79, 70, 229, 0.4);
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.3;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        .portal-wrapper {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            margin-top: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .upload-zone {
            border: 2px dashed var(--primary);
            border-radius: 16px;
            padding: 45px 20px;
            text-align: center;
            background-color: rgba(15, 23, 42, 0.6);
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            margin-bottom: 25px;
        }

        .upload-zone:hover, .upload-zone.dragover {
            background-color: rgba(79, 70, 229, 0.1);
            border-color: #818CF8;
        }

        .upload-icon {
            font-size: 3.2rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .file-input {
            display: none;
        }

        .file-details {
            display: none;
            background-color: var(--bg-input);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 15px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: var(--primary-hover);
        }

        .ai-processing-box {
            display: none;
            background-color: var(--bg-input);
            border: 1px solid var(--primary);
            border-radius: 14px;
            padding: 25px;
            margin-top: 25px;
            text-align: center;
        }

        .ai-status-text {
            font-size: 1.1rem;
            color: #818CF8;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .btn-download {
            display: none;
            width: 100%;
            padding: 16px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            margin-top: 15px;
            box-sizing: border-box;
        }

        .floating-whatsapp {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-decoration: none;
            z-index: 9999;
        }

        html[dir="rtl"] .floating-whatsapp {
            right: auto;
            left: 25px;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 30px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">Simaloc</a>
            <div class="nav-right">
                <button class="lang-switch-btn" onclick="toggleLanguage()" id="langBtn">العربية</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <span class="badge" id="hero-badge">Ultra-Fast AI Subtitling Platform</span>
        <h1 id="hero-title">AI Audio & Video Subtitling & Timing Powered by Groq AI</h1>
        <p id="hero-desc">Upload your media file to generate accurate timed subtitles (.SRT) in seconds.</p>
    </section>

    <div class="container">
        <div class="portal-wrapper" id="portal">
            <h2 style="text-align: center; margin-bottom: 10px;" id="portal-title">File Upload & Instant Processing</h2>

            <form id="orderForm" onsubmit="handleOrderSubmit(event)">
                <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <h3 id="upload-hint">Click to upload or
