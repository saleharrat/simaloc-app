<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

        :root {

            --text-muted: #94A3B8;

        * {

            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {

            color: var(--text-light);
            line-height: 1.6;
        }

        header {

            position: sticky;
            top: 0;

            padding: 15px 0;
        }

            align-items: center;
        }

            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .lang-switch-btn {

            border: 1px solid var(--primary);

            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .lang-switch-btn:hover {
            background-color: var(--primary);
        }

            padding: 80px 20px 40px;

            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(79, 70, 229, 0.4);
        }

            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 20px;

            -webkit-text-fill-color: transparent;
        }

        .hero p {

            color: var(--text-muted);
            margin-bottom: 30px;
        }
